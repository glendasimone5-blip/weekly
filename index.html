<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly — Task Console</title>
<meta name="app-version" content="2026-10-10a">
<meta name="app-notes" content="Reminder popups, period heads-up and check-in notices, event end times, editing completed tasks, a new weekly balance view, backup and restore, and a New Task button that opens the full form.">
<script>
  // Runs before anything else in <head>, including the external libraries
  // below (which block parsing while they load) — otherwise the theme
  // attribute wouldn't be set until after those finish fetching, and the
  // page would flash the default theme first on every load. Paired with
  // html[data-theme="..."] override rules in the stylesheet below.
  (function(){
    try{
      var raw = localStorage.getItem('weekly-app:meta');
      if(raw){
        var theme = JSON.parse(raw).theme;
        if(theme && theme !== 'moonlit'){ document.documentElement.setAttribute('data-theme', theme); }
      }
    }catch(e){ /* stylesheet default (Moonlit) applies; JS load will still correct it */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
  :root{
    /* Moonlit / lunar: a cool, deep indigo-slate base with a pearlescent
       blue-white accent — warmth (rose/gold) now appears only as a rare,
       deliberate hint, not the app's identity. Kept clearly saturated
       rather than near-black, so the indigo actually reads as a color. */
    --bg:#12142C;
    --surface:#1B1E3F;
    --surface-2:#242850;
    --border:#333865;
    --text:#FFFFFF;
    --text-dim:#D9DCF7;
    --text-faint:#ADB3E0;
    --accent:#C9D9F5;
    --accent-dim:#5A6592;
    --accent-glow:rgba(201,217,245,0.30);
    --on-accent:#12142A;
    --danger:#E8768F;
    --danger-glow:rgba(232,118,143,0.30);
    --success:#7DD3B8;
    --phase-follicular:#4FD1C5;
    --phase-ovulation:#C792EA;
    --phase-luteal:#D4A574;
    --trimester-1:#7BAAF7;
    --trimester-2:#4FD1C5;
    --trimester-3:#D4A574;
    --plot-rose:#E0A8C0;
    --plot-rose-glow:rgba(224,168,192,0.30);
    --plot-lavender:#B8A8E8;
    --radius:10px;
    --display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --brand: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  }
  /* Theme overrides — Moonlit is the :root default above; these apply the
     instant html[data-theme] is set, whether by the head-script fast path
     or by applyTheme() at runtime. Kept in sync with the THEMES object in
     the app script; if you add a theme there, mirror it here too. */
  html[data-theme="moonstone"]{
    --bg:#F5F5FB; --surface:#FCFCFF; --surface-2:#E8E8F3; --border:#C6C6DE;
    --text:#23232E; --text-dim:#52526B; --text-faint:#63637D;
    --accent:#5468BE; --accent-dim:#A8B2DE; --accent-glow:rgba(84,104,190,0.22); --on-accent:#FFFFFF;
    --danger:#A02D4E; --danger-glow:rgba(160,45,78,0.18); --success:#1F6B4A;
    --phase-follicular:#2F9E90; --phase-ovulation:#8F6BA8; --phase-luteal:#B5793A;
    --trimester-1:#4A7AD1; --trimester-2:#2F9E90; --trimester-3:#B5793A;
    --plot-rose:#8F3A63; --plot-rose-glow:rgba(143,58,99,0.18); --plot-lavender:#6B7BC7;
  }
  html[data-theme="sage"]{
    --bg:#F2EAD9; --surface:#F8F2E5; --surface-2:#E8DCC0; --border:#B89F68;
    --text:#2E2318; --text-dim:#5C4A32; --text-faint:#6E5A3E;
    --accent:#5F7052; --accent-dim:#9CAD8F; --accent-glow:rgba(95,112,82,0.22); --on-accent:#FFFFFF;
    --danger:#A02D4E; --danger-glow:rgba(160,45,78,0.18); --success:#3D6B4A;
    --phase-follicular:#6B8A6E; --phase-ovulation:#8A6B8F; --phase-luteal:#B5883A;
    --trimester-1:#6B7A94; --trimester-2:#6B8A6E; --trimester-3:#B5883A;
    --plot-rose:#8A3F50; --plot-rose-glow:rgba(138,63,80,0.20); --plot-lavender:#8A6B8F;
  }
  html[data-theme="plum"]{
    --bg:#241220; --surface:#331A2C; --surface-2:#3F2136; --border:#5C2E4C;
    --text:#FBF1F6; --text-dim:#E0B8D0; --text-faint:#C08FAE;
    --accent:#E85FA0; --accent-dim:#8A4468; --accent-glow:rgba(232,95,160,0.28); --on-accent:#2A1420;
    --danger:#F0879E; --danger-glow:rgba(240,135,158,0.28); --success:#8FE0BE;
    --phase-follicular:#5FCFC0; --phase-ovulation:#D48FE0; --phase-luteal:#E0A874;
    --trimester-1:#8FA8E8; --trimester-2:#5FCFC0; --trimester-3:#E0A874;
    --plot-rose:#F0A8C8; --plot-rose-glow:rgba(240,168,200,0.30); --plot-lavender:#C8A8E8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,217,245,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-glow); }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  a{ color:inherit; }

  /* ---------- App shell ---------- */
  #app{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding-bottom:18px; border-bottom:1px solid var(--border);
    margin-bottom:22px; flex-wrap:wrap; gap:14px;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; cursor:pointer; }
  .brand h1{
    font-family:var(--brand); font-weight:600; font-size:32px;
    font-variation-settings:"SOFT" 40, "opsz" 60;
    letter-spacing:-0.01em; color:var(--text);
  }
  .brand .dot{ color:var(--accent); font-size:0.55em; vertical-align:middle; }
  .brand .sub{ font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:1.5px; text-transform:uppercase; }
  .rename-hint{ font-size:13px; color:var(--text-faint); opacity:0; transition:opacity .15s; }
  .brand:hover .rename-hint{ opacity:1; }
  .appname-input{
    font-family:var(--brand); font-weight:600; font-size:32px;
    font-variation-settings:"SOFT" 40, "opsz" 60; letter-spacing:-0.01em;
    background:transparent; border:none; border-bottom:2px solid var(--accent); color:var(--text);
    outline:none; max-width:280px; padding:0 2px;
  }

  nav.tabs{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px; }
  nav.tabs button{
    border:none; background:transparent; color:var(--text-dim);
    padding:8px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    transition:background .15s, color .15s;
  }
  nav.tabs button.active{ background:var(--accent); color:var(--on-accent); }

  .bell-btn{
    display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--border); color:var(--text-dim); border-radius:999px;
    padding:8px 14px; font-size:12.5px; font-family:var(--mono);
  }
  .bell-btn.on{ color:var(--accent); border-color:var(--accent-dim); }

  /* ---------- For the plot: deliberately a different, softer register
     than the rest of the app — this is the one part that isn't about
     getting things done. ---------- */
  /* ---------- Settings ---------- */
  .settings-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    width:44px; height:44px; font-size:19px; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); flex-shrink:0;
  }
  .settings-btn:hover{ border-color:var(--accent-dim); }
  .settings-modal{ max-width:420px; width:100%; }
  .settings-section{ margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--border); }
  .settings-section:last-of-type{ border-bottom:none; margin-bottom:8px; padding-bottom:0; }
  .settings-section-title{
    font-family:var(--mono); font-size:10.5px; color:var(--text-faint); letter-spacing:1px;
    text-transform:uppercase; margin-bottom:10px;
  }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; color:var(--text-dim); }
  .settings-subsection-title{
    font-family:var(--mono); font-size:9.5px; color:var(--text-faint); letter-spacing:0.8px;
    text-transform:uppercase; margin:14px 0 8px;
  }
  .sound-option-grid{ display:flex; flex-direction:column; gap:6px; }
  .sound-option{
    display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:9px 12px; text-align:left; width:100%;
  }
  .sound-option:hover{ border-color:var(--accent-dim); }
  .sound-option.active{ border-color:var(--accent); background:var(--accent-glow); }
  .sound-option-radio{
    width:14px; height:14px; border-radius:50%; border:1.5px solid var(--border); flex-shrink:0;
    background:var(--surface);
  }
  .sound-option-radio.checked{ border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 3px var(--surface-2); }
  .sound-option-text{ flex:1; display:flex; flex-direction:column; gap:1px; }
  .sound-option-label{ font-size:12.5px; color:var(--text); font-weight:600; }
  .sound-option-desc{ font-size:10.5px; color:var(--text-faint); }
  .sound-option-play{ color:var(--text-faint); font-size:11px; flex-shrink:0; }
  .sound-option.active .sound-option-play{ color:var(--accent); }
  .settings-action-btn{
    background:var(--accent); color:var(--on-accent); border:none; border-radius:7px;
    padding:8px 16px; font-size:12.5px; font-weight:700; flex-shrink:0;
  }
  .settings-toggle-row{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-dim); cursor:pointer; margin-bottom:8px; }
  .settings-hint{ font-size:11.5px; color:var(--text-faint); line-height:1.6; }
  .settings-danger-zone{ }
  .settings-danger-btn{
    background:transparent; border:1px solid var(--danger); color:var(--danger);
    border-radius:7px; padding:9px 16px; font-size:12.5px; font-weight:600; margin-top:10px;
  }
  .settings-theme-grid{ display:flex; flex-direction:column; gap:4px; }
  .theme-option{
    display:flex; align-items:center; gap:10px; background:transparent; border:none;
    border-radius:8px; padding:7px 8px; font-size:13px; color:var(--text-dim); text-align:left;
  }
  .theme-option:hover{ background:var(--surface-2); }
  .theme-option.active{ background:var(--surface-2); color:var(--text); font-weight:600; }
  .theme-swatch-preview{
    width:20px; height:20px; border-radius:50%; border:2px solid; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .theme-swatch-dot{ width:8px; height:8px; border-radius:50%; }
  .theme-option-label{ flex:1; }
  .theme-option-check{ color:var(--accent); font-size:12px; }

  .plot-wrap{ position:relative; }
  .plot-btn{
    position:relative; overflow:visible;
    background:radial-gradient(circle at 30% 30%, rgba(232,163,196,0.25), var(--surface));
    border:1.5px solid var(--plot-rose); border-radius:32% 68% 65% 35% / 40% 35% 65% 60%;
    width:52px; height:52px; font-size:22px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 0 var(--plot-rose-glow); transition:box-shadow .2s, border-radius .4s;
  }
  .plot-btn:hover{
    box-shadow:0 0 16px var(--plot-rose-glow);
    border-radius:65% 35% 32% 68% / 60% 65% 35% 40%;
  }
  @keyframes sparkTwinkle{
    0%, 100%{ opacity:0; transform:scale(0.4); }
    50%{ opacity:1; transform:scale(1); }
  }
  .plot-spark{
    position:absolute; width:4px; height:4px; border-radius:50%; background:var(--plot-rose);
    box-shadow:0 0 6px var(--plot-rose-glow); pointer-events:none;
    animation: sparkTwinkle 2.6s ease-in-out infinite;
  }
  .plot-spark.s1{ top:-4px; left:12px; animation-delay:0s; }
  .plot-spark.s2{ top:14px; right:-6px; animation-delay:0.9s; }
  .plot-spark.s3{ bottom:-4px; left:22px; animation-delay:1.7s; }
  @keyframes popoverBurst{
    0%{ box-shadow:0 0 0 0 var(--plot-rose-glow), 0 16px 32px rgba(0,0,0,0.5); }
    35%{ box-shadow:0 0 26px 6px var(--plot-rose-glow), 0 16px 32px rgba(0,0,0,0.5); }
    100%{ box-shadow:0 0 0 0 rgba(224,168,192,0), 0 16px 32px rgba(0,0,0,0.5); }
  }
  .plot-popover.sparkle-burst{ animation: popoverBurst 0.9s ease-out; }
  .plot-popover{
    position:absolute; top:calc(100% + 10px); right:0; z-index:80; width:260px;
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    border:1px solid var(--plot-rose); border-radius:12px; padding:16px;
    box-shadow:0 16px 32px rgba(0,0,0,0.5);
  }
  .plot-popover-label{ font-family:var(--mono); font-size:10.5px; color:var(--plot-rose); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
  .plot-popover-text{ font-family:var(--display); font-size:15px; line-height:1.5; color:var(--text); margin-bottom:14px; }
  .plot-popover-actions{ display:flex; gap:8px; }
  .plot-ack-btn{
    flex:1; background:var(--plot-rose); border:none; color:#2A1420; border-radius:7px;
    padding:8px; font-size:12px; font-weight:700;
  }
  .plot-dismiss-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-faint);
    border-radius:7px; padding:8px 10px; font-size:12px;
  }

  .plot-log-panel{ margin-bottom:22px; }
  .plot-log-entry{
    display:flex; align-items:baseline; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-left:3px solid var(--plot-rose); border-radius:8px; padding:10px 14px; margin-bottom:7px;
  }
  .plot-log-date{ font-family:var(--mono); font-size:10.5px; color:var(--plot-rose); flex-shrink:0; width:52px; }
  .plot-log-text{ font-size:13px; color:var(--text-dim); line-height:1.4; }
  .plot-log-more{ font-family:var(--mono); font-size:11px; color:var(--text-faint); text-align:center; padding:6px; }

  .search-wrap{ position:relative; flex:1; min-width:160px; max-width:280px; }
  .search-wrap input{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:999px; padding:9px 14px 9px 32px; font-size:13px; outline:none;
  }
  .search-wrap input:focus{ border-color:var(--accent); }
  .search-wrap .icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:13px; pointer-events:none; }
  .search-wrap .clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); background:transparent; border:none;
    color:var(--text-faint); font-size:14px; padding:2px 6px;
  }

  /* ---------- Pulse strip (signature element) ---------- */
  .pulse-wrap{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .pulse-label{ font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; }
  .pulse-track{ flex:1; display:flex; gap:5px; min-width:220px; }
  .pulse-day{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .pulse-today-dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 7px var(--accent-glow); }
  .pulse-bar-bg{ width:100%; height:34px; background:var(--surface-2); border-radius:5px; position:relative; overflow:hidden; border:1px solid var(--border); }
  .pulse-day.today .pulse-bar-bg{ border:1.5px solid var(--accent); box-shadow:0 0 0 1px var(--accent-glow), 0 0 12px var(--accent-glow); }
  .pulse-bar-fill{ position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg, var(--success), #3F9C6D); }
  .pulse-day-label{ font-family:var(--mono); font-size:10px; color:var(--text-faint); }
  .pulse-day-label.today{ color:var(--accent); font-weight:700; }
  .pulse-score{ font-family:var(--display); font-size:26px; color:var(--accent); white-space:nowrap; }
  .pulse-score span{ font-family:var(--mono); font-size:11px; color:var(--text-faint); display:block; text-align:right; }
  .pulse-legend{ font-family:var(--mono); font-size:10px; color:var(--text-faint); display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .pulse-legend .sw{ width:8px; height:8px; border-radius:2px; display:inline-block; }
  .pulse-legend .sw.done{ background:var(--success); }
  .pulse-legend .sw.today{ border:1.5px solid var(--accent); box-shadow:0 0 6px var(--accent-glow); background:transparent; border-radius:50%; width:6px; height:6px; }

  /* ---------- Reminder banner ---------- */
  .banner{
    background:linear-gradient(90deg, rgba(201,217,245,0.14), rgba(201,217,245,0.02));
    border:1px solid var(--accent-dim); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .banner .msg{ font-size:14px; line-height:1.5; }
  .banner .msg b{ color:var(--accent); }
  .banner button{ background:transparent; border:1px solid var(--border); color:var(--text-dim); border-radius:6px; padding:6px 12px; font-size:12px; }
  .habit-banner-actions{ display:flex; gap:8px; flex-shrink:0; }
  .habit-accept-btn{ background:var(--accent) !important; border:none !important; color:var(--on-accent) !important; font-weight:700; }

  .enable-banner{
    background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius);
    padding:12px 16px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:14px; font-size:13px; color:var(--text-dim);
  }
  .enable-banner button{ background:var(--accent); color:var(--on-accent); border:none; border-radius:6px; padding:7px 14px; font-weight:600; font-size:12.5px; }
  .enable-banner-note{ display:block; margin-top:5px; font-size:11.5px; color:var(--text-faint); line-height:1.5; }

  /* ---------- Front-page extras: dashboard strip, quick-add, today panel ---------- */
  .dashboard-strip{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    margin-bottom:16px; padding:2px 2px 0;
  }
  .dashboard-greeting{ font-size:13.5px; color:var(--text-dim); }
  .dashboard-greeting b{ color:var(--text); }
  .dashboard-chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .stat-chip{
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    border-radius:999px; padding:5px 12px; font-family:var(--mono); font-size:11.5px; white-space:nowrap;
  }

  .quickadd-row{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 14px; margin-bottom:16px;
  }
  .quickadd-icon{ color:var(--accent); font-size:16px; font-weight:700; flex-shrink:0; }
  .quickadd-row input{
    flex:1; background:transparent; border:none; color:var(--text); font-size:13.5px; outline:none;
  }
  .quickadd-btn{ background:var(--accent); color:var(--on-accent); border:none; border-radius:7px; padding:7px 14px; font-weight:700; font-size:12.5px; flex-shrink:0; }
  .quickadd-full-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-dim); border-radius:7px;
    padding:7px 12px; font-weight:600; font-size:12.5px; flex-shrink:0; white-space:nowrap;
  }
  .quickadd-full-btn:hover{ border-color:var(--accent-dim); color:var(--text); }
  @media (max-width:480px){
    .quickadd-row{ flex-wrap:wrap; }
    .quickadd-row input{ flex-basis:100%; order:1; }
    .quickadd-icon{ order:0; }
    .quickadd-btn, .quickadd-full-btn{ order:2; flex:1; text-align:center; }
  }

  .today-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:20px;
  }
  .today-panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .today-panel-title{ font-family:var(--display); font-size:16px; color:var(--text); }
  .today-panel-count{ font-family:var(--mono); font-size:11px; color:var(--text-faint); }

  .modal h2{ font-family:var(--display); font-size:19px; margin-bottom:16px; }

  .field label{ display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:5px; font-family:var(--mono); text-transform:uppercase; letter-spacing:0.5px; }
  .field input, .field select, .field textarea{

    border-radius:7px; padding:9px 11px; font-size:13.5px; outline:none;

  .field textarea{ resize:vertical; min-height:56px; }
  /* Native date/time inputs default to a black calendar icon, which is
     invisible against this dark theme — color-scheme flips the browser's
     built-in picker to a dark-appropriate palette, and the indicator filter
     is a fallback for browsers that don't fully theme it. */
  .field input[type="date"]{
    color-scheme: dark;
    cursor: pointer;
  }
  .field input[type="date"]::-webkit-calendar-picker-indicator{
    filter: invert(0.8) brightness(1.3);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
  }
  .field input[type="date"]::-webkit-calendar-picker-indicator:hover{

<div id="app"></div>

<script>
(function(){

/* ============================ STATE ============================ */
const DAY_MS = 86400000;
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CAT_COLORS = ['#A8C5E8','#8FE0C7','#C9B8F0','#8FD9E8','#B8CDF0','#A0E8D4','#D4C9F0'];

let state = {
  tasks: [],        // {id, title, category, dueDate('YYYY-MM-DD'), notes, completed, completedAt, createdAt}
  categories: ['Work','Home','Health'],
  meta: { lastReminderDate: null, seenBadges: [], appName: 'WEEKLY', calendarPlacement: 'sidebar', cloneCounts: {}, declinedHabitSuggestions: [], wrappedSeenYears: [], theme: 'moonlit', periodMigrationDone: false, notificationSound: 'chime' },
  period: { cycleLength: 28, periodLength: 5, confirmedStarts: [], dayOverrides: {}, loggedPeriods: [], mode: 'cycle', pregnancy: { dueDate: null }, enabled: false },
  periodEditMode: false,
  periodLogFormOpen: false,
  periodEditingEntry: null,
  returnToCycleFormOpen: false,
  showWrappedIntro: false,
  wrappedIntroYear: null,
  plot: { shuffledOrder: [], pointer: 0, log: [] },
  habitSuggestion: null,
  plotSuggestionOpen: false,
  currentPlotSuggestion: null,
  view: 'week',      // 'week' | 'all' | 'completed' | 'report'
  weekOffset: 0,      // 0 = this week
  monthOffset: 0,      // 0 = this month (for Completed view)
  activeCategory: 'all',
  allTasksCategory: 'all',
  searchQuery: '',
  notifPermission: (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported',
  showBanner: false,
  bannerText: '',
  modalOpen: false,
  editingTask: null,
  lastToggledId: null,
  toast: null,
  editingAppName: false,
  calendarMonthOffset: 0,
  calendarSelectedDate: null,
  expandedSubtaskIds: [],
  currentTheme: 'moonlit',
  settingsOpen: false,
  loaded: false
};

/* ============================ THEMES ============================ */
const THEMES = {
  moonlit: {
    label: 'Moonlit', dark: true,
    vars: {
      '--bg':'#12142C','--surface':'#1B1E3F','--surface-2':'#242850','--border':'#333865',
      '--text':'#FFFFFF','--text-dim':'#D9DCF7','--text-faint':'#ADB3E0',
      '--accent':'#C9D9F5','--accent-dim':'#5A6592','--accent-glow':'rgba(201,217,245,0.30)','--on-accent':'#12142A',
      '--danger':'#E8768F','--danger-glow':'rgba(232,118,143,0.30)','--success':'#7DD3B8',
      '--phase-follicular':'#4FD1C5','--phase-ovulation':'#C792EA','--phase-luteal':'#D4A574',
      '--trimester-1':'#7BAAF7','--trimester-2':'#4FD1C5','--trimester-3':'#D4A574',
      '--plot-rose':'#E0A8C0','--plot-rose-glow':'rgba(224,168,192,0.30)','--plot-lavender':'#B8A8E8'
    },
    chart: { line:'#C9D9F5', lineFill:'rgba(201,217,245,0.15)', tick:'#D9DCF7', grid:'#242850', bar:'rgba(232,118,143,0.55)' },
    exportBg: '#1B1E3F'
  },
  moonstone: {
    label: 'Moonstone', dark: false,
    vars: {
      '--bg':'#F5F5FB','--surface':'#FCFCFF','--surface-2':'#E8E8F3','--border':'#C6C6DE',
      '--text':'#23232E','--text-dim':'#52526B','--text-faint':'#63637D',
      '--accent':'#5468BE','--accent-dim':'#A8B2DE','--accent-glow':'rgba(84,104,190,0.22)','--on-accent':'#FFFFFF',
      '--danger':'#A02D4E','--danger-glow':'rgba(160,45,78,0.18)','--success':'#1F6B4A',
      '--phase-follicular':'#2F9E90','--phase-ovulation':'#8F6BA8','--phase-luteal':'#B5793A',
      '--trimester-1':'#4A7AD1','--trimester-2':'#2F9E90','--trimester-3':'#B5793A',
      '--plot-rose':'#8F3A63','--plot-rose-glow':'rgba(143,58,99,0.18)','--plot-lavender':'#6B7BC7'
    },
    chart: { line:'#5468BE', lineFill:'rgba(84,104,190,0.15)', tick:'#52526B', grid:'#E8E8F3', bar:'rgba(160,45,78,0.5)' },
    exportBg: '#FCFCFF'
  },
  sage: {
    label: 'Sage', dark: false,
    vars: {
      '--bg':'#F2EAD9','--surface':'#F8F2E5','--surface-2':'#E8DCC0','--border':'#B89F68',
      '--text':'#2E2318','--text-dim':'#5C4A32','--text-faint':'#6E5A3E',
      '--accent':'#5F7052','--accent-dim':'#9CAD8F','--accent-glow':'rgba(95,112,82,0.22)','--on-accent':'#FFFFFF',
      '--danger':'#A02D4E','--danger-glow':'rgba(160,45,78,0.18)','--success':'#3D6B4A',
      '--phase-follicular':'#6B8A6E','--phase-ovulation':'#8A6B8F','--phase-luteal':'#B5883A',
      '--trimester-1':'#6B7A94','--trimester-2':'#6B8A6E','--trimester-3':'#B5883A',
      '--plot-rose':'#8A3F50','--plot-rose-glow':'rgba(138,63,80,0.20)','--plot-lavender':'#8A6B8F'
    },
    chart: { line:'#5F7052', lineFill:'rgba(95,112,82,0.15)', tick:'#5C4A32', grid:'#E8DCC0', bar:'rgba(160,45,78,0.5)' },
    exportBg: '#F8F2E5'
  },
  plum: {
    label: 'Plum', dark: true,
    vars: {
      '--bg':'#241220','--surface':'#331A2C','--surface-2':'#3F2136','--border':'#5C2E4C',
      '--text':'#FBF1F6','--text-dim':'#E0B8D0','--text-faint':'#C08FAE',
      '--accent':'#E85FA0','--accent-dim':'#8A4468','--accent-glow':'rgba(232,95,160,0.28)','--on-accent':'#2A1420',
      '--danger':'#F0879E','--danger-glow':'rgba(240,135,158,0.28)','--success':'#8FE0BE',
      '--phase-follicular':'#5FCFC0','--phase-ovulation':'#D48FE0','--phase-luteal':'#E0A874',
      '--trimester-1':'#8FA8E8','--trimester-2':'#5FCFC0','--trimester-3':'#E0A874',
      '--plot-rose':'#F0A8C8','--plot-rose-glow':'rgba(240,168,200,0.30)','--plot-lavender':'#C8A8E8'
    },
    chart: { line:'#E85FA0', lineFill:'rgba(232,95,160,0.15)', tick:'#E0B8D0', grid:'#3F2136', bar:'rgba(240,135,158,0.5)' },
    exportBg: '#331A2C'
  }
};
const THEME_ORDER = ['moonlit','moonstone','sage','plum'];

function applyTheme(themeKey){
  const key = THEMES[themeKey] ? themeKey : 'moonlit';
  // Moonlit is the stylesheet's :root default, so it's applied by removing
  // the attribute rather than by re-declaring its values redundantly here.
  if(key === 'moonlit'){ document.documentElement.removeAttribute('data-theme'); }
  else{ document.documentElement.setAttribute('data-theme', key); }
  state.currentTheme = key;
}

/* ============================ STORAGE ============================ */
const hasCloudStorage = (typeof window !== 'undefined' && !!window.storage);
const LS_PREFIX = 'weekly-app:';

async function storageGet(key){
  if(hasCloudStorage){
    try{ return await window.storage.get(key); }
    catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(LS_PREFIX+key);
    return v!=null ? {key, value:v, shared:false} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasCloudStorage){
    try{ return await window.storage.set(key, value); }
    catch(e){ console.error('storage.set failed', key, e); return null; }
  }
  try{
    localStorage.setItem(LS_PREFIX+key, value);
    return {key, value, shared:false};
  }catch(e){ console.error('localStorage.setItem failed', key, e); return null; }
}

async function loadState(){
  try{
    const t = await storageGet('tasks');
    state.tasks = t ? JSON.parse(t.value) : [];
  }catch(e){ state.tasks = []; }
  try{
    const c = await storageGet('categories');
    state.categories = c ? JSON.parse(c.value) : state.categories;
  }catch(e){ /* keep defaults */ }
  try{
    const m = await storageGet('meta');
    state.meta = m ? Object.assign({ lastReminderDate:null, seenBadges:[], appName:'WEEKLY', calendarPlacement:'sidebar', cloneCounts:{}, declinedHabitSuggestions:[], wrappedSeenYears:[], theme:'moonlit', periodMigrationDone:false, notificationSound:'chime' }, JSON.parse(m.value)) : state.meta;
  }catch(e){ /* keep defaults */ }
  try{
    const p = await storageGet('period');
    state.period = p ? Object.assign({ cycleLength:28, periodLength:5, confirmedStarts:[], dayOverrides:{}, loggedPeriods:[], mode:'cycle', pregnancy:{dueDate:null}, enabled:false }, JSON.parse(p.value)) : state.period;
  }catch(e){ /* keep defaults */ }
  try{
    const pl = await storageGet('plot');
    state.plot = pl ? Object.assign({ shuffledOrder:[], pointer:0, log:[] }, JSON.parse(pl.value)) : state.plot;
  }catch(e){ /* keep defaults */ }
  state.loaded = true;
}
async function saveTasks(){
  try{ await storageSet('tasks', JSON.stringify(state.tasks)); }catch(e){ console.error('save tasks failed', e); }
}
async function saveCategories(){
  try{ await storageSet('categories', JSON.stringify(state.categories)); }catch(e){ console.error('save categories failed', e); }

/* ============================ DATE HELPERS ============================ */
function todayStr(){ return fmt(new Date()); }
function fmt(d){
  // Use local date components (not toISOString, which converts to UTC and
  // can shift the calendar day depending on timezone offset / time of day).
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){ const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); }
function startOfWeek(offset){
  const now = new Date();
  const day = (now.getDay() + 6) % 7; // Mon=0
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + offset*7);
  return monday;
}
function weekDates(offset){
  const start = startOfWeek(offset);
  return Array.from({length:7}, (_,i)=>{ const d = new Date(start); d.setDate(start.getDate()+i); return d; });
}
function isOverdue(task){
  if(task.type==='event') return false;
  if(task.completed) return false;
  return task.dueDate < todayStr();
}
function isInWeek(dateStr, offset){
  const dates = weekDates(offset).map(fmt);
  return dates.includes(dateStr);
}
function weekLabel(offset){
  const dates = weekDates(offset);
  const opts = {month:'short', day:'numeric'};
  const label = dates[0].toLocaleDateString('en-US', opts) + ' – ' + dates[6].toLocaleDateString('en-US', opts);
  return offset===0 ? 'This Week · ' + label : (offset<0 ? label + ' (past)' : label + ' (upcoming)');
}
function isoWeekKey(dateStr){
  const d = parseDate(dateStr);
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay()+6)%7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(),0,4);
  const diff = target - firstThursday;
  const week = 1 + Math.round(diff / (7*DAY_MS));
  return target.getFullYear() + '-W' + String(week).padStart(2,'0');
}
function monthDate(offset){ const now = new Date(); return new Date(now.getFullYear(), now.getMonth()+offset, 1); }
function monthLabel(offset){ return monthDate(offset).toLocaleDateString('en-US',{month:'long', year:'numeric'}); }
function isInMonth(dateStr, offset){
  const d = parseDate(dateStr);
  const m = monthDate(offset);
  return d.getFullYear()===m.getFullYear() && d.getMonth()===m.getMonth();
}
function nextDueDate(dateStr, recurrence){
  const d = parseDate(dateStr);
  if(recurrence==='daily') d.setDate(d.getDate()+1);
  else if(recurrence==='weekly') d.setDate(d.getDate()+7);
  else if(recurrence==='monthly') d.setMonth(d.getMonth()+1);
  else if(recurrence==='yearly') d.setFullYear(d.getFullYear()+1);
  return fmt(d);
}
function niceDate(dateStr){
  return parseDate(dateStr).toLocaleDateString('en-US',{month:'short', day:'numeric'});
}
const RECUR_LABEL = { daily:'Daily', weekly:'Weekly', monthly:'Monthly', yearly:'Yearly' };

function calendarGridDates(offset){
  const base = monthDate(offset);
  const year = base.getFullYear(), month = base.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = (firstOfMonth.getDay()+6)%7; // Mon=0
  const gridStart = new Date(year, month, 1 - startWeekday);
  return Array.from({length:42}, (_,i)=>{ const d = new Date(gridStart); d.setDate(gridStart.getDate()+i); return d; });
}

/* ============================ PERIOD TRACKING ============================ */
// Periods are logged explicitly as {id, start, end} — end is null while a
// period is "still ongoing". This replaced an earlier tap-a-calendar-day
// model that couldn't clearly represent start/end or variable-length
// periods; explicit logging is clearer and more accurate.

function currentOngoingPeriod(){
  return state.period.loggedPeriods.find(p=>p.end===null) || null;
}

// Predicts future periods by extrapolating forward from the most recently
// logged period's start, using the average cycle length and typical period
// length, out to a horizon.
function predictedPeriods(){
  const logged = state.period.loggedPeriods;
  if(!logged.length) return [];
  const sorted = [...logged].sort((a,b)=>a.start.localeCompare(b.start));
  let cursor = sorted[sorted.length-1].start;
  const horizonEnd = fmt(new Date(Date.now() + 180*DAY_MS));
  const predicted = [];
  let guard = 0;
  while(guard < 24){
    const d = parseDate(cursor);
    d.setDate(d.getDate() + state.period.cycleLength);
    const start = fmt(d);
    if(start > horizonEnd) break;
    const endD = parseDate(start); endD.setDate(endD.getDate() + state.period.periodLength - 1);
    predicted.push({ start, end: fmt(endD) });
    cursor = start;
    guard++;
  }
  return predicted;
}

// Returns null (not a period day) or {status:'confirmed'|'predicted'}.
function periodDayInfo(dateStr){
  if(!state.period.enabled || state.period.mode !== 'cycle') return null;
  for(const p of state.period.loggedPeriods){
    const end = p.end || todayStr(); // ongoing periods count through today
    if(dateStr >= p.start && dateStr <= end) return { status:'confirmed', id:p.id };
  }
  for(const p of predictedPeriods()){
    if(dateStr >= p.start && dateStr <= p.end) return { status:'predicted' };
  }
  return null;
}

// Estimates which cycle phase a date falls into, based on average cycle
// length and a fixed ~14-day luteal phase (the standard approximation,
// since luteal length is far less variable than follicular length across
// cycles). This is a statistical estimate from averages, not a measurement.
function cyclePhaseInfo(dateStr){
  if(!state.period.enabled || state.period.mode !== 'cycle') return null;
  const starts = [...state.period.loggedPeriods.map(p=>p.start), ...predictedPeriods().map(p=>p.start)].sort();
  if(!starts.length) return null;
  let start = null;
  for(const s of starts){ if(s <= dateStr) start = s; else break; }
  if(!start) return null;

  const cLen = state.period.cycleLength;
  const dayIndex = Math.round((parseDate(dateStr) - parseDate(start)) / DAY_MS);
  if(dayIndex < 0 || dayIndex >= cLen) return null;

  const pLen = state.period.periodLength;
  const ovulationDay = Math.max(pLen, cLen - 14);
  const fertileStart = Math.max(pLen, ovulationDay - 2);
  const fertileEnd = Math.min(cLen-1, ovulationDay + 1);

  if(dayIndex < pLen) return { phase:'menstrual' };
  if(dayIndex >= fertileStart && dayIndex <= fertileEnd) return { phase:'ovulation' };
  if(dayIndex < fertileStart) return { phase:'follicular' };
  return { phase:'luteal' };
}

// Pregnancy week/trimester from a due date, via the standard 280-day
// (40-week) gestation estimate back to last menstrual period.
function pregnancyWeekInfo(dateStr){
  if(!state.period.enabled || state.period.mode !== 'pregnancy' || !state.period.pregnancy.dueDate) return null;
  const due = parseDate(state.period.pregnancy.dueDate);
  const lmp = new Date(due); lmp.setDate(lmp.getDate() - 280);
  const diffDays = Math.round((parseDate(dateStr) - lmp) / DAY_MS);
  if(diffDays < 0) return null;
  const week = Math.floor(diffDays/7) + 1;
  if(week > 42) return null;
  const trimester = week<=13 ? 1 : week<=27 ? 2 : 3;
  return { week, trimester };
}

// Returning from pregnancy mode to cycle tracking re-anchors predictions
// from the real return-of-period date, rather than resuming stale
// pre-pregnancy predictions — postpartum cycles rarely pick up where they
// left off.
async function returnToCycleTracking(returnDateStr){
  state.period.loggedPeriods.push({ id: genId(), start: returnDateStr, end: null });
  state.period.mode = 'cycle';
  await savePeriod();
  render();
}

function weeksAlongToDueDate(weeks){
  const due = new Date();
  due.setDate(due.getDate() - weeks*7 + 280);
  return fmt(due);
}

// One-time migration from the old tap-to-mark model (confirmedStarts +
// dayOverrides) to explicit logged start/end periods, so existing tracked
// periods aren't lost when this changes.
function migratePeriodData(){
  if((!state.period.loggedPeriods || !state.period.loggedPeriods.length) &&
     state.period.confirmedStarts && state.period.confirmedStarts.length){
    state.period.loggedPeriods = state.period.confirmedStarts.map(start=>{
      const endD = parseDate(start); endD.setDate(endD.getDate() + (state.period.periodLength-1));
      return { id: genId(), start, end: fmt(endD) };
    });
    return true;
  }
  return false;
}

// One-time only: if someone already had real period data from before the
// enabled/disabled toggle existed, turn it on for them so they don't
// silently lose visibility of their own history. Guarded by a meta flag so
// it never re-enables the feature after someone explicitly turns it off.
function migratePeriodEnabledFlag(){

    state.period.enabled = true;
  }
  return true;
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Draws the next suggestion from a shuffled cycle through the whole list —
// no repeats until every suggestion has come up once, then reshuffles.
function drawPlotSuggestion(){
  if(!state.plot.shuffledOrder.length || state.plot.pointer >= state.plot.shuffledOrder.length){
    state.plot.shuffledOrder = shuffleArray(PLOT_SUGGESTIONS.map((_,i)=>i));
    state.plot.pointer = 0;
  }
  const idx = state.plot.shuffledOrder[state.plot.pointer];
  state.plot.pointer++;
  savePlot();
  return PLOT_SUGGESTIONS[idx];
}

/* ============================ MUTATIONS ============================ */
function genId(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }

const RECUR_HORIZON_DAYS = 90; // how far ahead daily/weekly/monthly tasks are pre-populated
const RECUR_MAX_GEN = 60;      // safety cap per generation pass

// The horizon must always be wider than the gap between occurrences, or the
// next one can never fall inside it. Yearly's 365-day gap alone exceeds the
// standard 90-day horizon, so a yearly task would generate once and then
// never generate again — exactly wrong for something like a birthday.
function horizonDaysFor(recurrence){
  return recurrence==='yearly' ? 400 : RECUR_HORIZON_DAYS;
}

// Generates future occurrences for a recurring series, starting the day
// AFTER fromDateStr, up to the rolling horizon. Returns the new task records
// (not yet pushed into state.tasks).
function generateSeriesOccurrences(seed, seriesId, fromDateStr){
  const horizonEnd = fmt(new Date(Date.now() + horizonDaysFor(seed.recurrence)*DAY_MS));
  const created = [];
  let cursor = fromDateStr;
  let guard = 0;
  while(guard < RECUR_MAX_GEN){
    const next = nextDueDate(cursor, seed.recurrence);
    if(next > horizonEnd) break;
    created.push({
      id: genId(), type: seed.type || 'task', title: seed.title, category: seed.category, dueDate: next,
      time: seed.time || '', remindTime: seed.remindTime || '', endTime: seed.endTime || '', notes: seed.notes || '', recurrence: seed.recurrence, seriesId,
      priority: seed.type==='event' ? false : !!seed.priority, subtasks: [],
      completed: false, completedAt: null, createdAt: todayStr()
    });
    cursor = next;
    guard++;
  }
  return created;
}

// Tops up every recurring series so it always has occurrences generated out
// to the rolling horizon — called on load and after completions, since the
// horizon window shifts forward as time passes.
function topUpAllSeries(){
  const seriesMap = {};
  state.tasks.forEach(t=>{ if(t.seriesId){ (seriesMap[t.seriesId] = seriesMap[t.seriesId]||[]).push(t); } });
  let changed = false;
  Object.keys(seriesMap).forEach(sid=>{
    const items = seriesMap[sid];
    const maxDue = items.reduce((m,t)=> t.dueDate>m?t.dueDate:m, items[0].dueDate);
    const seed = items[items.length-1];
    const horizonEnd = fmt(new Date(Date.now() + horizonDaysFor(seed.recurrence)*DAY_MS));
    if(maxDue < horizonEnd){
      const more = generateSeriesOccurrences(seed, sid, maxDue);
      if(more.length){ state.tasks.push(...more); changed = true; }
    }
  });
  return changed;
}

// One-time migration: recurring tasks saved under the old "generate one
// occurrence at a time on completion" model have no seriesId. Adopt them
// into a series (using their own id) so topUpAllSeries can populate their
// missing future occurrences retroactively.
function migrateLegacyRecurring(){
  let changed = false;
  state.tasks.forEach(t=>{
    if(t.recurrence && t.recurrence!=='none' && !t.seriesId){
      t.seriesId = t.id;
      changed = true;
    }
  });
  return changed;
}

// Existing tasks saved before Events existed have no 'type'/'time' fields —
// default them to plain tasks so nothing silently becomes an event.
function migrateTaskFields(){
  let changed = false;
  state.tasks.forEach(t=>{
    if(t.type === undefined){ t.type = 'task'; changed = true; }
    if(t.time === undefined){ t.time = ''; changed = true; }
    if(t.remindTime === undefined){ t.remindTime = ''; changed = true; }
    if(t.endTime === undefined){ t.endTime = ''; changed = true; }
    if(t.priority === undefined){ t.priority = false; changed = true; }
    if(t.subtasks === undefined){ t.subtasks = []; changed = true; }
  });
  return changed;
}

async function addTask(data){
  const recurrence = data.recurrence || 'none';
  const type = data.type === 'event' ? 'event' : 'task';
  const id = genId();
  const task = {
    id,
    type,
    title: data.title,
    category: data.category,
    dueDate: data.dueDate,
    time: data.time || '',
    remindTime: data.remindTime || '',
    endTime: data.endTime || '',
    notes: data.notes || '',
    recurrence,
    seriesId: recurrence!=='none' ? id : null,
    priority: type==='event' ? false : !!data.priority,
    subtasks: type==='event' ? [] : (data.subtasks || []),
    completed: false,
    completedAt: null,
    createdAt: todayStr()
  };
  state.tasks.push(task);
  if(recurrence !== 'none'){
    const more = generateSeriesOccurrences(task, task.seriesId, task.dueDate);
    state.tasks.push(...more);
  }
  await saveTasks();
  checkForNewBadges();
  render();

  if(state.toast){
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 3800);
  }
}

async function duplicateTask(id){
  const orig = state.tasks.find(t=>t.id===id);
  if(!orig) return;

  const clone = {
    id: genId(),
    type: orig.type || 'task', time: orig.time || '', endTime: orig.endTime || '', remindTime: orig.remindTime || '', priority: !!orig.priority,
    subtasks: (orig.subtasks || []).map(s=>({ id: genId(), title: s.title, completed: false })),
    title: orig.title,
    category: orig.category,
    dueDate: todayStr(),
    notes: orig.notes,
    recurrence: 'none',
    seriesId: null,
    completed: false,
    completedAt: null,
    createdAt: todayStr()
  };
  state.tasks.push(clone);

  // Habit-nudge: if this exact title has now been cloned 3+ times (and isn't
  // already recurring, and hasn't been declined before), suggest turning it
  // into a real recurring task instead of manually re-adding it each time.
  const key = orig.title.trim().toLowerCase();
  if(orig.recurrence==='none' && !state.meta.declinedHabitSuggestions.includes(key)){
    state.meta.cloneCounts[key] = (state.meta.cloneCounts[key]||0) + 1;
    if(state.meta.cloneCounts[key] >= 3){
      state.habitSuggestion = { title: orig.title, key };
    }
  }

  await saveTasks();
  await saveMeta();
  checkForNewBadges();
  render();
}

function acceptHabitSuggestion(){
  if(!state.habitSuggestion) return;
  const key = state.habitSuggestion.key;
  const candidates = state.tasks
    .filter(t=> t.title.trim().toLowerCase()===key && !t.completed)
    .sort((a,b)=> b.dueDate.localeCompare(a.dueDate));
  const target = candidates[0];
  state.habitSuggestion = null;
  if(target){
    state.editingTask = target;
    state.modalOpen = true;
  }
  render();
}

function declineHabitSuggestion(){
  if(!state.habitSuggestion) return;

  state.habitSuggestion = null;

  render();
}
async function updateTask(id, data){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const oldDueDate = t.dueDate;
  const oldRecurrence = t.recurrence || 'none';
  const newRecurrence = data.recurrence || 'none';
  // Editing a finished occurrence never rewrites the rest of its series.
  const patternChanged = !t.completed && ((newRecurrence !== oldRecurrence) || (data.dueDate !== oldDueDate));

  Object.assign(t, data);

  if(patternChanged){
    // Drop this series' stale, not-yet-completed future tail — it no
    // longer matches the (possibly new) pattern or start date.
    if(t.seriesId){
      state.tasks = state.tasks.filter(x=> !(x.seriesId===t.seriesId && x.id!==t.id && !x.completed && x.dueDate > oldDueDate));
    }
    if(newRecurrence !== 'none'){
      if(!t.seriesId) t.seriesId = t.id;
      const more = generateSeriesOccurrences(t, t.seriesId, t.dueDate);
      state.tasks.push(...more);
    } else {
      t.seriesId = null;
    }
  }

  await saveTasks();
  render();
}
async function deleteTask(id){
  state.tasks = state.tasks.filter(x=>x.id!==id);
  await saveTasks();
  render();
}

// Dismiss the "element of surprise" popover on any click outside it. A

// Three short tones synthesized with the Web Audio API rather than shipped
// as audio files — no assets to host, no licensing to worry about, and it
// works identically everywhere. Kept deliberately soft/short.
function playTone(ctx, freq, startTime, duration, type='sine', peakGain=0.15){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}
const NOTIFICATION_SOUNDS = {
  chime: { label:'Chime', desc:'Soft two-note rise', play:(ctx)=>{
    const now = ctx.currentTime;
    playTone(ctx, 523.25, now, 0.35, 'sine', 0.15);      // C5
    playTone(ctx, 659.25, now+0.12, 0.4, 'sine', 0.15);  // E5
  }},
  bell: { label:'Bell', desc:'Single warm tone', play:(ctx)=>{
    const now = ctx.currentTime;
    playTone(ctx, 440, now, 0.9, 'sine', 0.18);
    playTone(ctx, 880, now, 0.6, 'sine', 0.06);
  }},
  pulse: { label:'Pulse', desc:'Gentle double beep', play:(ctx)=>{
    const now = ctx.currentTime;
    playTone(ctx, 660, now, 0.15, 'triangle', 0.15);
    playTone(ctx, 660, now+0.22, 0.15, 'triangle', 0.15);
  }},
  off: { label:'Off', desc:'Silent, popup only', play:()=>{} }
};
let sharedAudioCtx = null;
function getAudioCtx(){
  if(!sharedAudioCtx){
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    try{ sharedAudioCtx = new Ctor(); }catch(e){ return null; }
  }
  if(sharedAudioCtx.state === 'suspended'){ sharedAudioCtx.resume().catch(()=>{}); }
  return sharedAudioCtx;
}
function playNotificationSound(){
  const key = state.meta.notificationSound || 'chime';
  if(key === 'off') return;
  const sound = NOTIFICATION_SOUNDS[key] || NOTIFICATION_SOUNDS.chime;
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{ sound.play(ctx); }catch(e){}
}

/* ---------- Per-task reminders: in-app popup + sound, while the tab is open ---------- */
let reminderPopups = [];
const snoozeUntil = {};
const REMINDER_WINDOW_MIN = 120; // a reminder missed by more than this is skipped, not replayed

function checkTaskReminders(){
  // Never rebuild the DOM under an open form; it would wipe what's being typed.
  if(!state.loaded || state.modalOpen || state.settingsOpen || state.editingAppName) return;
  const today = todayStr();
  const fired = state.meta.firedReminders || (state.meta.firedReminders = {});
  Object.keys(fired).forEach(k=>{ if(!k.endsWith('|'+today)) delete fired[k]; });
  const d = new Date(), nowMin = d.getHours()*60 + d.getMinutes(), nowMs = d.getTime();
  let changed = false;
  state.tasks.forEach(t=>{
    if(!t.remindTime || t.completed || t.dueDate!==today) return;
    if(reminderPopups.some(p=>p.id===t.id)) return;
    const key = t.id+'|'+today;
    let due = false;
    if(snoozeUntil[t.id]){ due = nowMs >= snoozeUntil[t.id]; }
    else if(!fired[key]){
      const [h,m] = t.remindTime.split(':').map(Number);
      const diff = nowMin - (h*60+m);
      due = diff>=0 && diff<=REMINDER_WINDOW_MIN;
    }
    if(!due) return;
    delete snoozeUntil[t.id];
    fired[key] = 1; changed = true;
    reminderPopups.push({ id:t.id });
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      try{ new Notification((state.meta.appName||'Weekly')+' — Reminder', { body: t.title }); }catch(e){}
    }
  });
  if(changed){ saveMeta(); playNotificationSound(); render(); }
}

function renderReminderPopups(){
  const wrap = el('div',{class:'reminder-popups'});
  reminderPopups.forEach(p=>{
    const t = state.tasks.find(x=>x.id===p.id);
    if(!t) return;
    const close = ()=>{ reminderPopups = reminderPopups.filter(x=>x.id!==p.id); };
    wrap.appendChild(el('div',{class:'reminder-popup'},
      el('div',{class:'reminder-popup-label'}, (t.type==='event' ? '📌 Event' : '🔔 Reminder')+' · '+formatTime12h(t.remindTime)),

        el('button',{onclick:()=>{ snoozeUntil[t.id] = Date.now()+10*60000; close(); render(); }}, 'Snooze 10 min'),
        el('button',{onclick:()=>{ close(); render(); }}, 'Dismiss')
      )
    ));

  return wrap;
}

/* ============================ STATS ============================ */
function computeStats(){
  const realTasks = state.tasks.filter(t=>t.type!=='event');
  const completed = realTasks.filter(t=>t.completed);
  // "Actionable" tasks: due today/earlier, or already completed. Excludes
  // not-yet-due future rows (including pre-generated recurring occurrences)
  // from the denominator — you shouldn't be marked down for something
  // that isn't due yet.
  const actionable = realTasks.filter(t=> t.completed || t.dueDate <= todayStr());
  const total = actionable.length;
  const completionRate = total ? Math.round((completed.length/total)*100) : 0;

  // avg days to complete
  let avgDays = 0;
  if(completed.length){
    const sum = completed.reduce((acc,t)=>{
      const c = parseDate(t.completedAt), created = parseDate(t.createdAt);
      return acc + Math.max(0, Math.round((c-created)/DAY_MS));
    },0);
    avgDays = (sum/completed.length).toFixed(1);
  }

  // streak: consecutive days (ending today or yesterday) with >=1 completion
  const completedDates = new Set(completed.map(t=>t.completedAt));
  let streak = 0;
  let cursor = new Date();
  // allow today to be empty without breaking streak if it's still "in progress"
  if(!completedDates.has(fmt(cursor))) cursor.setDate(cursor.getDate()-1);
  while(completedDates.has(fmt(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  let longest = 0, run = 0;
  const allDates = Array.from(completedDates).sort();
  for(let i=0;i<allDates.length;i++){
    if(i===0){ run=1; } else {
      const prev = parseDate(allDates[i-1]), cur = parseDate(allDates[i]);
      run = ((cur-prev)/DAY_MS === 1) ? run+1 : 1;
    }
    longest = Math.max(longest, run);
  }

  // weekly buckets (last 8 weeks) for completion % and overdue count
  const weeks = [];
  for(let i=7;i>=0;i--){
    const dates = weekDates(-i);
    const key = isoWeekKey(fmt(dates[0]));
    const label = dates[0].toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const weekDateStrs = dates.map(fmt);
    const dueThisWeek = realTasks.filter(t=>weekDateStrs.includes(t.dueDate));
    const doneOnTime = dueThisWeek.filter(t=>t.completed);
    const rate = dueThisWeek.length ? Math.round((doneOnTime.length/dueThisWeek.length)*100) : null;
    const overdueCount = dueThisWeek.filter(t=> t.completed ? (t.completedAt > t.dueDate) : (t.dueDate < todayStr())).length;
    weeks.push({label, rate, overdueCount, hasData: dueThisWeek.length>0});
  }

  return { total, completedCount: completed.length, completionRate, avgDays, streak, longest, weeks };
}

function computeInsights(){
  const stats = computeStats();
  const insights = [];

  // Week-over-week comparison
  const weeks = stats.weeks;
  const thisWk = weeks[weeks.length-1], lastWk = weeks[weeks.length-2];
  if(thisWk && lastWk && thisWk.hasData && lastWk.hasData){
    const delta = thisWk.rate - lastWk.rate;
    if(delta !== 0){
      insights.push({ icon: delta>0?'▲':'▼', tone: delta>0?'good':'bad',
        text: `Completion is ${Math.abs(delta)}% ${delta>0?'up':'down'} from last week — ${lastWk.rate}% → ${thisWk.rate}%.` });
    } else {
      insights.push({ icon:'■', tone:'neutral', text:`Completion held steady at ${thisWk.rate}% this week.` });
    }
  }

  // Best / weakest category
  const catStats = state.categories.map(cat=>{
    const tasks = state.tasks.filter(t=>t.type!=='event' && t.category===cat && (t.completed || t.dueDate < todayStr()));
    const completed = tasks.filter(t=>t.completed).length;
    return { cat, total: tasks.length, rate: tasks.length ? Math.round(completed/tasks.length*100) : null };
  }).filter(c=>c.total >= 2);
  if(catStats.length){
    const best = catStats.slice().sort((a,b)=>b.rate-a.rate)[0];
    insights.push({ icon:'★', tone:'good', text:`${best.cat} is your strongest category — ${best.rate}% completed on time.` });
    const worst = catStats.slice().sort((a,b)=>a.rate-b.rate)[0];
    if(worst.cat !== best.cat && worst.rate < 70){
      insights.push({ icon:'⚠', tone:'bad', text:`${worst.cat} tends to slip — only ${worst.rate}% completed on time.` });
    }
  }

  // Toughest weekday (most late/overdue tasks land here)
  const dayNames7 = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const dayCounts = [0,0,0,0,0,0,0];
  state.tasks.filter(t=>t.type!=='event').forEach(t=>{
    const wasLate = t.completed ? (t.completedAt > t.dueDate) : isOverdue(t);
    if(wasLate){ dayCounts[(parseDate(t.dueDate).getDay()+6)%7]++; }
  });
  const maxCount = Math.max(...dayCounts);
  if(maxCount >= 2){
    insights.push({ icon:'◐', tone:'bad', text:`${dayNames7[dayCounts.indexOf(maxCount)]} tasks are most likely to run late — ${maxCount} so far.` });
  }

  // Average time-to-close
  if(stats.completedCount >= 3){
    insights.push({ icon:'⏱', tone:'neutral', text:`On average you close a task ${stats.avgDays} day${Number(stats.avgDays)===1?'':'s'} after adding it.` });
  }

  return insights;
}

/* ============================ XP / LEVELS / BADGES ============================ */
function computeXp(){
  let xp = 0;
  const seenSeries = new Set();
  state.tasks.filter(t=>t.type!=='event').forEach(t=>{
    // "Planning" credit: once per standalone task, but only once per
    // recurring series — otherwise pre-generating a series' future
    // occurrences would inflate XP as if each were separately planned.
    if(t.seriesId){
      if(!seenSeries.has(t.seriesId)){ xp += 5; seenSeries.add(t.seriesId); }
    } else {
      xp += 5;
    }
    if(t.completed){
      xp += 15; // credit for follow-through — closing it out
      if(t.completedAt && t.completedAt <= t.dueDate) xp += 5; // on-time bonus
    }
  });
  return xp;
}
function distinctEntryCount(){
  const seenSeries = new Set();
  let count = 0;
  state.tasks.filter(t=>t.type!=='event').forEach(t=>{
    if(t.seriesId){
      if(!seenSeries.has(t.seriesId)){ count++; seenSeries.add(t.seriesId); }
    } else {
      count++;
    }
  });
  return count;
}
function levelInfo(){
  const xp = computeXp();
  let level = 1, remaining = xp, threshold = 100;
  while(remaining >= threshold){
    remaining -= threshold;
    level++;
    threshold = 100 + (level-1)*50;
  }
  return { level, xp, xpIntoLevel: remaining, xpForNextLevel: threshold, pct: Math.round((remaining/threshold)*100) };
}

/* ============================ YEAR IN REVIEW ============================ */
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function computeYearStats(year){
  const yearTasks = state.tasks.filter(t=> t.completed && t.completedAt && t.completedAt.slice(0,4)===String(year));
  const totalCompleted = yearTasks.length;

  const monthCounts = Array(12).fill(0);
  yearTasks.forEach(t=>{ const m = parseInt(t.completedAt.slice(5,7),10)-1; monthCounts[m]++; });
  let busiestMonthIdx = -1;
  monthCounts.forEach((c,i)=>{ if(c>0 && (busiestMonthIdx===-1 || c>monthCounts[busiestMonthIdx])) busiestMonthIdx=i; });

  const catCounts = {};
  yearTasks.forEach(t=> catCounts[t.category]=(catCounts[t.category]||0)+1);
  const topCategoryEntry = Object.entries(catCounts).sort((a,b)=>b[1]-a[1])[0] || null;

  const datesSet = new Set(yearTasks.map(t=>t.completedAt));
  const sortedDates = [...datesSet].sort();
  let longest=0, run=0;
  sortedDates.forEach((d,i)=>{
    if(i===0){ run=1; } else {
      const prev=parseDate(sortedDates[i-1]), cur=parseDate(d);
      run = (Math.round((cur-prev)/DAY_MS)===1) ? run+1 : 1;
    }
    longest=Math.max(longest,run);
  });

  const plotCount = state.plot.log.filter(e=> e.date && e.date.slice(0,4)===String(year)).length;

  return { year, totalCompleted, monthCounts, busiestMonthIdx, topCategory: topCategoryEntry, longest, plotCount };
}

// Deliberately avoids a "performance report" tone. A quiet year gets a
// restful, aspirational framing rather than a lower score — the point is to
// find something true and warm to say regardless of how much got done.
function yearToneInfo(stats){
  if(stats.totalCompleted < 20){
    return {
      title: 'A Restful Year',
      metaphor: (stats.totalCompleted===0 && stats.plotCount===0)
        ? "Some years are quiet by design. Nothing bloomed loudly here — but the soil is still there, waiting for spring."
        : "Not every year is for growing loudly. This one looks more like a seed resting in the soil — quiet, but never empty."
    };
  }
  if(stats.totalCompleted < 150){
    return {
      title: 'A Steady Year',
      metaphor: "Slow, steady growth — the kind that doesn't always show day to day, but adds up all the same."
    };
  }
  return {
    title: 'A Flourishing Year',
    metaphor: "A year in full bloom — task after task, day after day, building into something real."
  };
}

// Points out specific things that went well, based on actual activity —
// never invented, never a criticism of what didn't happen.
function wellDoneLines(stats){
  const lines = [];
  if(stats.topCategory){ lines.push(`${stats.topCategory[0]} was where you showed up most — ${stats.topCategory[1]} task${stats.topCategory[1]===1?'':'s'} closed there.`); }
  if(stats.longest >= 3){ lines.push(`Your longest streak reached ${stats.longest} days in a row.`); }
  if(stats.plotCount > 0){ lines.push(`You did something just for yourself ${stats.plotCount} time${stats.plotCount===1?'':'s'} this year.`); }
  if(stats.busiestMonthIdx >= 0){ lines.push(`${MONTH_NAMES[stats.busiestMonthIdx]} was your busiest month.`); }
  if(!lines.length){ lines.push('Every year has its own shape — this one was yours.'); }
  return lines.slice(0,3);
}

// Shared season check: mid-December through mid-January. Used both by the
// one-time auto-popup and by whether the Report tab shows the panel at all —
// this was meant to be a seasonal thing, not a year-round fixture.
function wrappedSeasonInfo(){
  const now = new Date();
  const month = now.getMonth(); // 0-indexed; 11 = December
  const day = now.getDate();
  const inSeason = (month===11 && day>=15) || (month===0 && day<=15);
  const targetYear = month===0 ? now.getFullYear()-1 : now.getFullYear();
  return { inSeason, targetYear };
}

// Surfaces the review automatically once per season. Uses last year's data
// during the January portion (so the review is always for a completed
// year, not a fragment).
function checkWrappedTrigger(){
  const { inSeason, targetYear } = wrappedSeasonInfo();
  if(!inSeason) return;
  if(!state.meta.wrappedSeenYears.includes(targetYear)){
    state.showWrappedIntro = true;
    state.wrappedIntroYear = targetYear;
    state.meta.wrappedSeenYears.push(targetYear);
    saveMeta();
  }
}

function getUpcomingTasks(daysAhead){
  const start = todayStr();
  const endD = new Date(); endD.setDate(endD.getDate()+daysAhead);
  const end = fmt(endD);
  // Recurring series are pre-generated out to a 90-day horizon (see
  // generateSeriesOccurrences), which comfortably covers this window, so
  // every upcoming occurrence already exists as a real task — no need to
  // project virtual ones (which would just duplicate them).
  return state.tasks
    .filter(t=>!t.completed && t.dueDate>=start && t.dueDate<=end)
    .sort((a,b)=> a.dueDate.localeCompare(b.dueDate) || a.title.localeCompare(b.title));
}

/* ============================ RENDER ============================ */
let chartInstances = [];

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on') && typeof v==='function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  }
  children.flat().forEach(c=>{
    if(c==null) return;
    const isPrimitive = typeof c==='string' || typeof c==='number' || typeof c==='boolean';
    e.appendChild(isPrimitive ? document.createTextNode(String(c)) : c);
  });
  return e;
}

function catColor(cat){
  const idx = state.categories.indexOf(cat);
  return CAT_COLORS[idx % CAT_COLORS.length] || 'var(--text-dim)';
}

function render(){
  const app = document.getElementById('app');

  // Capture focus/selection state before wiping the DOM, so we can restore it
  // after rebuilding — avoids relying on blur events, which fire synchronously
  // during teardown and race against any flag-based refocus logic. Generalized
  // to any focusable element with a stable id (search box, rename field, etc).
  const activeEl = document.activeElement;
  const focusedId = (activeEl && activeEl.id) ? activeEl.id : null;
  const isTextInput = focusedId && (activeEl.tagName==='INPUT' || activeEl.tagName==='TEXTAREA');
  const selStart = isTextInput ? activeEl.selectionStart : null;
  const selEnd = isTextInput ? activeEl.selectionEnd : null;

  app.innerHTML = '';
  chartInstances.forEach(c=>c.destroy());
  chartInstances = [];

  app.appendChild(renderHeader());
  app.appendChild(renderPulse());
  if(state.habitSuggestion){ app.appendChild(renderHabitBanner()); }
  { const pn = renderPeriodNoticeBanner(); if(pn){ app.appendChild(pn); } }
  if(state.updateAvailable){ app.appendChild(renderUpdateBanner()); }
  if(state.showBanner){ app.appendChild(renderBanner()); }
  else if(state.notifPermission === 'default'){ app.appendChild(renderEnableBanner()); }

  if(state.searchQuery.trim()){
    app.appendChild(renderSearchView());
  } else if(state.view === 'week'){
    app.appendChild(renderWeekView());
  } else if(state.view === 'calendar'){
    app.appendChild(renderCalendarTabView());
  } else if(state.view === 'upcoming'){
    app.appendChild(renderUpcomingView());
  } else if(state.view === 'all'){
    app.appendChild(renderAllTasksView());
  } else if(state.view === 'completed'){
    app.appendChild(renderCompletedView());
  } else {
    app.appendChild(renderReportView());
  }

  app.appendChild(el('div',{class:'fine'}, '◆ '+(state.meta.appName||'WEEKLY')+' — your task console · saving via ' + (hasCloudStorage ? 'Claude.ai storage' : 'this browser (localStorage)')));

  if(state.toast){ app.appendChild(el('div',{class:'toast'}, state.toast.text)); }

  if(reminderPopups.length){ app.appendChild(renderReminderPopups()); }
  if(state.modalOpen){ app.appendChild(renderModal()); }
  if(state.showWrappedIntro){ app.appendChild(renderWrappedModal()); }
  if(state.settingsOpen){ app.appendChild(renderSettingsModal()); }

  if(focusedId){
    const newInput = document.getElementById(focusedId);
    if(newInput){
      newInput.focus();
      if(selStart!=null){ newInput.setSelectionRange(selStart, selEnd); }
    }
  }
}

function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    let p;
    try{ p = JSON.parse(await f.text()); }catch(e){ alert("That file couldn't be read as a backup."); return; }
    const d = p && p.data;
    if(!p || p.app!=='weekly' || !d || !Array.isArray(d.tasks) || !Array.isArray(d.categories)){
      alert("This doesn't look like a Weekly backup file."); return;
    }
    const when = p.exportedAt ? p.exportedAt.slice(0,10) : 'unknown date';
    if(!confirm('Replace everything in the app with the backup from '+when+' ('+d.tasks.length+' items)? What is in the app now will be overwritten.')) return;
    state.tasks = d.tasks;
    state.categories = d.categories.length ? d.categories : state.categories;
    state.meta = Object.assign({}, state.meta, d.meta || {});
    state.period = Object.assign({ cycleLength:28, periodLength:5, confirmedStarts:[], dayOverrides:{}, loggedPeriods:[], mode:'cycle', pregnancy:{dueDate:null}, enabled:false }, d.period || {});
    state.plot = Object.assign({ shuffledOrder:[], pointer:0, log:[] }, d.plot || {});
    migrateTaskFields(); migrateLegacyRecurring(); topUpAllSeries(); migratePeriodData();
    applyTheme(state.meta.theme);
    await saveTasks(); await saveCategories(); await saveMeta(); await savePeriod(); await savePlot();
    state.settingsOpen = false;
    state.toast = { text:'✓ Backup restored.' };
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 3500);
  };
  inp.click();
}

function renderPulse(){
  // Weekly Balance: where this week's attention is going, by category. No comparison with
  // other weeks and no score. Counts and category names carry the meaning, never colour alone.
  const offset = state.weekOffset;
  const dates = weekDates(offset).map(fmt);
  const tasks = state.tasks.filter(t=>t.type!=='event' && dates.includes(t.dueDate));
  const cats = state.categories.map(cat=>{
    const items = tasks.filter(t=>t.category===cat);
    return { cat, total: items.length, done: items.filter(t=>t.completed).length };
  }).filter(c=>c.total>0);
  const total = tasks.length, done = tasks.filter(t=>t.completed).length;
  const moments = state.plot.log.filter(e=>e.date && dates.includes(e.date)).length;
  const label = offset===0 ? 'Weekly Balance' : 'Weekly Balance · ' + weekLabel(offset);

  const main = el('div',{class:'pulse-balance-main'}, el('div',{class:'pulse-label'}, label));
  if(!total){
    main.appendChild(el('div',{class:'balance-note'}, 'Nothing planned this week yet.'));
  } else {
    const bar = el('div',{class:'balance-bar'});
    cats.forEach(c=>{
      bar.appendChild(el('div',{class:'balance-seg', style:'flex:'+c.total+' 1 0;', title:c.cat+': '+c.done+' of '+c.total+' done'},
        el('div',{class:'balance-seg-bg', style:'background:'+catColor(c.cat)}),
        el('div',{class:'balance-seg-fill', style:'background:'+catColor(c.cat)+'; width:'+Math.round(c.done/c.total*100)+'%'})
      ));
    });
    main.appendChild(bar);
    main.appendChild(el('div',{class:'balance-legend'},
      cats.map(c=> el('span',{}, el('i',{class:'cat-swatch', style:'background:'+catColor(c.cat)}), c.cat+' '+c.done+'/'+c.total))
    ));
    const top = cats.slice().sort((a,b)=>b.total-a.total)[0];
    if(total >= 4 && top.total/total >= 0.7){
      main.appendChild(el('div',{class:'balance-note'}, 'This week leans toward ' + top.cat + '.'));
    }
  }
  main.appendChild(el('div',{class:'balance-note'}, moments
    ? '✨ ' + moments + ' moment' + (moments===1?'':'s') + ' for yourself this week'
    : '✨ A small moment for yourself is one tap away'));

  return el('div',{class:'pulse-wrap pulse-balance'},
    main,
    total ? el('div',{}, el('div',{class:'pulse-score'}, done+'/'+total, el('span',{},'done this week'))) : null
  );
}

function renderPulseLegacy(){
  const offset = state.weekOffset;
  const dates = weekDates(offset);
  const today = todayStr();
  const maxima = dates.map(d=>{
    const ds = fmt(d);
    const due = state.tasks.filter(t=>t.type!=='event' && t.dueDate===ds);
    const done = due.filter(t=>t.completed);
    return due.length ? done.length/due.length : 0;
  });
  const stats = computeStats();
  const track = el('div',{class:'pulse-track'});
  dates.forEach((d,i)=>{
    const ds = fmt(d);
    const isToday = ds===today;
    const pct = Math.round(maxima[i]*100);
    track.appendChild(el('div',{class:'pulse-day'+(isToday?' today':'')},
      el('div',{class:'pulse-today-dot', style: isToday ? '' : 'visibility:hidden'}),
      el('div',{class:'pulse-bar-bg'},
        el('div',{class:'pulse-bar-fill', style:`height:${Math.max(pct,4)}%`})
      ),
      el('div',{class:'pulse-day-label'+(isToday?' today':'')}, DAY_NAMES[i])
    ));
  });
  const pulseLabel = offset===0 ? 'Weekly Pulse' : 'Weekly Pulse · ' + weekLabel(offset);
  const weeks = stats.weeks;
  const thisWk = weeks[weeks.length-1], lastWk = weeks[weeks.length-2];
  let deltaEl = null;
  if(thisWk && lastWk && thisWk.hasData && lastWk.hasData){
    const delta = thisWk.rate - lastWk.rate;
    const dir = delta>0?'up':delta<0?'down':'flat';
    const arrow = delta>0?'▲':delta<0?'▼':'■';
    deltaEl = el('div',{class:'pulse-delta '+dir}, `${arrow} ${Math.abs(delta)}% vs last wk`);
  }
  return el('div',{class:'pulse-wrap'},
    el('div',{},
      el('div',{class:'pulse-label'}, pulseLabel),
      el('div',{class:'pulse-legend', style:'margin-top:6px;'},
        el('span',{class:'sw done'}), 'completed that day',
        el('span',{style:'width:10px;display:inline-block;'}),
        el('span',{class:'sw today'}), 'today'
      )
    ),
    track,
    el('div',{},
      el('div',{class:'pulse-score'}, stats.completionRate+'%', el('span',{},'all-time')),
      deltaEl
    )
  );
}


function periodNoticeStore(){
  const m = state.meta;
  if(!m.periodNotice) m.periodNotice = { dismissed:{}, snoozeUntil:{}, fired:{} };
  return m.periodNotice;
}
function periodLeadDays(){ const v = state.meta.periodLeadDays; return v === undefined ? 2 : v; }

// Decides which period notice (if any) applies today. Pure: reads state, changes nothing.
//  headsup: 1..N days before the expected start (N = setting; 0 turns heads-ups off)
//  dayof:   the expected start day itself
//  checkin: from the day after the expected start, until it's logged, skipped, or snoozed to a later day
function currentPeriodNotice(){
  if(!state.period.enabled || state.period.mode !== 'cycle' || !state.period.loggedPeriods.length) return null;
  if(currentOngoingPeriod()) return null;
  const next = predictedPeriods()[0];
  if(!next) return null;
  const store = periodNoticeStore();
  const today = todayStr();
  const days = Math.round((parseDate(next.start) - parseDate(today)) / DAY_MS);
  const lead = periodLeadDays();
  if(days >= 1 && days <= lead){ return store.dismissed[next.start+'|h'] ? null : { kind:'headsup', start:next.start, days }; }
  if(days === 0 && lead > 0){ return store.dismissed[next.start+'|h'] ? null : { kind:'dayof', start:next.start, days }; }
  if(days <= -1){
    if(store.dismissed[next.start+'|c']) return null;
    if((store.snoozeUntil[next.start] || '') > today) return null;
    return { kind:'checkin', start:next.start, days:-days };
  }
  return null;
}

function periodNoticeText(n){
  if(n.kind === 'headsup') return '🩸 Your period is estimated to start in ' + n.days + ' day' + (n.days===1?'':'s') + ' (around ' + niceDate(n.start) + ').';
  if(n.kind === 'dayof') return '🩸 Your period is estimated to start today.';
  return '🩸 Quick check-in: your period was expected around ' + niceDate(n.start) + '. Has it started? No pressure, this just keeps your log accurate.';
}
function tomorrowStr(){ const d = new Date(); d.setDate(d.getDate()+1); return fmt(d); }
function goLogPeriodOn(startStr){
  const d = parseDate(startStr), now = new Date();
  state.view = 'calendar'; state.searchQuery = '';
  state.calendarMonthOffset = (d.getFullYear()-now.getFullYear())*12 + (d.getMonth()-now.getMonth());
  state.calendarSelectedDate = startStr;
  state.periodEditingEntry = null; state.periodLogFormOpen = true;
  render();
}
function renderPeriodNoticeBanner(){
  const n = currentPeriodNotice();
  if(!n) return null;
  const store = periodNoticeStore();
  const dismiss = (k)=>{ store.dismissed[k] = 1; saveMeta(); render(); };
  const actions = n.kind === 'checkin' ? [
    el('button',{class:'habit-accept-btn', onclick:()=>{ startPeriodToday(); }}, 'Yes, it started today'),
    el('button',{onclick:()=>{ goLogPeriodOn(n.start); }}, 'It started another day'),
    el('button',{onclick:()=>{ store.snoozeUntil[n.start] = tomorrowStr(); saveMeta(); render(); }}, 'Not yet'),
    el('button',{onclick:()=>{ dismiss(n.start+'|c'); }}, 'Skip this cycle')
  ] : [
    n.kind === 'dayof' ? el('button',{class:'habit-accept-btn', onclick:()=>{ startPeriodToday(); }}, 'It started') : null,
    el('button',{onclick:()=>{ dismiss(n.start+'|h'); }}, 'Got it')
  ];
  return el('div',{class:'banner period-notice'}, el('div',{class:'msg'}, periodNoticeText(n)), el('div',{class:'period-notice-actions'}, actions));
}

// Runs at load, on returning to the tab, and every 15 minutes (so it also catches midnight).
// Sound plus a system notification fire once per notice per day. The system notification is
// deliberately generic, since lock screens are visible to other people; details stay in the app.
let lastPeriodNoticeKey = null;
function checkPeriodNotice(){
  if(!state.loaded || state.modalOpen || state.settingsOpen || state.editingAppName) return;
  const n = currentPeriodNotice();
  const key = n ? n.kind+'|'+n.start+'|'+todayStr() : '';
  if(key === lastPeriodNoticeKey) return;
  lastPeriodNoticeKey = key;
  if(n){
    const store = periodNoticeStore();
    Object.keys(store.fired).forEach(k=>{ if(!k.endsWith('|'+todayStr())) delete store.fired[k]; });
    if(!store.fired[key]){
      store.fired[key] = 1; saveMeta(); playNotificationSound();
      if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
        try{ new Notification(state.meta.appName || 'Weekly', { body:'You have a check-in waiting.' }); }catch(e){}
      }
    }
  }
  render();
}

function renderBigCalendar(){
  const offset = state.calendarMonthOffset;
  const dates = calendarGridDates(offset);
  const monthName = monthDate(offset).toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const today = todayStr();
  const currentMonthIdx = monthDate(offset).getMonth();
  const mode = state.period.mode;
  const selectedDs = state.calendarSelectedDate || today;

  const grid = el('div',{class:'calendar-grid big-calendar-grid'});
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=> grid.appendChild(el('div',{class:'calendar-dow'}, d)));

  dates.forEach(d=>{
    const ds = fmt(d);
    const inMonth = d.getMonth()===currentMonthIdx;
    const isToday = ds===today;
    const isSelected = ds===selectedDs;
    const periodInfo = mode==='cycle' ? periodDayInfo(ds) : null;
    const phaseInfo = mode==='cycle' ? cyclePhaseInfo(ds) : null;
    const pregInfo = mode==='pregnancy' ? pregnancyWeekInfo(ds) : null;
    const dueTasks = state.tasks.filter(t=>t.dueDate===ds);

    let phaseClass = '';
    if(phaseInfo && phaseInfo.phase!=='menstrual'){ phaseClass = ' phase-'+phaseInfo.phase; }
    if(pregInfo){ phaseClass = ' trimester-'+pregInfo.trimester; }

    const cellClass = 'calendar-cell big-calendar-cell'
      +(inMonth?'':' other-month')+(isToday?' today':'')+(isSelected?' selected':'')
      +(periodInfo ? ' period-'+periodInfo.status : '')
      +phaseClass;

    const dotRow = el('div',{class:'calendar-dots'});
    dueTasks.slice(0,5).forEach(t=> dotRow.appendChild(
      t.type==='event'
        ? el('span',{class:'calendar-event-marker', style:`border-bottom-color:${catColor(t.category)}`})
        : el('span',{class:'calendar-dot', style:`background:${catColor(t.category)}`})
    ));
    if(dueTasks.length>5){ dotRow.appendChild(el('span',{class:'calendar-dot-more'}, '+'+(dueTasks.length-5))); }

    grid.appendChild(el('div',{
      class: cellClass,
      onclick: ()=>{ state.calendarSelectedDate = ds; render(); }
    },
      el('div',{class:'calendar-daynum'}, String(d.getDate())),
      dotRow
    ));
  });

  return el('div',{class:'calendar-widget big-calendar-widget'},
    el('div',{class:'calendar-header'},
      el('button',{onclick:()=>{state.calendarMonthOffset--; render();}}, '‹'),
      el('div',{class:'calendar-month-label'}, monthName),
      el('button',{onclick:()=>{state.calendarMonthOffset++; render();}}, '›')

    grid
  );
}

  const items = state.tasks

function renderTodayPanel(){
  const today = todayStr();
  const todays = state.tasks.filter(t=>t.dueDate===today).sort((a,b)=>
    (a.completed?1:0)-(b.completed?1:0) || (a.time||'99:99').localeCompare(b.time||'99:99') || a.title.localeCompare(b.title)
  );
  const realCount = todays.filter(t=>t.type!=='event').length;
  const doneCount = todays.filter(t=>t.type!=='event' && t.completed).length;

  const panel = el('div',{class:'today-panel'});

    el('div',{class:'today-panel-title'}, "Today's Focus"),

  if(!todays.length){
    panel.appendChild(el('div',{class:'today-panel-empty'}, 'Nothing due today — quick-add something above, or enjoy the clear day. ✨'));
  } else {
    todays.forEach(t=> panel.appendChild(renderTask(t)));
