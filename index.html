function renderMain(){
  const main = el('main',{class:'content'});

  if(state.calendarSelectedDate){
    const ds = state.calendarSelectedDate;
    let dayTasks = state.tasks.filter(t=>t.dueDate===ds);
    if(state.activeCategory !== 'all') dayTasks = dayTasks.filter(t=>t.category===state.activeCategory);
    const label = ds===todayStr() ? 'Today' : parseDate(ds).toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
    main.appendChild(el('div',{class:'section-title'},
      `${label} · ${dayTasks.length} task${dayTasks.length===1?'':'s'}`,
      el('button',{class:'calendar-clear-inline', onclick:()=>{ state.calendarSelectedDate=null; render(); }}, '✕ Clear')
    ));
    if(!dayTasks.length){
      main.appendChild(el('div',{class:'empty'}, 'Nothing due ', el('b',{},label), '.'));
      return main;
    }
    dayTasks.sort((a,b)=>a.title.localeCompare(b.title)).forEach(t=>main.appendChild(renderTask(t)));
    return main;
  }

  let tasks = state.tasks.filter(t=> isInWeek(t.dueDate, state.weekOffset) || (state.weekOffset===0 && isOverdue(t)));
  if(state.activeCategory !== 'all') tasks = tasks.filter(t=>t.category===state.activeCategory);

  if(!state.tasks.length){
    main.appendChild(el('div',{class:'empty'}, el('div',{}, el('b',{},'No tasks yet.'), ' Click “+ New Task” to plan your week.')));
    return main;
  }

  const overdue = tasks.filter(isOverdue).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  if(overdue.length){
    main.appendChild(el('div',{class:'section-title overdue'}, `⚠ Overdue — ${overdue.length}`));
    overdue.forEach(t=>main.appendChild(renderTask(t)));
  }

  const grouped = {};
  tasks.filter(t=>!isOverdue(t)).forEach(t=>{ (grouped[t.category] = grouped[t.category]||[]).push(t); });

  const cats = Object.keys(grouped).sort((a,b)=> state.categories.indexOf(a)-state.categories.indexOf(b));
  if(!cats.length && !overdue.length){
    main.appendChild(el('div',{class:'empty'}, 'Nothing scheduled ', el('b',{},'for this week'), ' in this view.'));
    return main;
  }
  cats.forEach(cat=>{
    const items = grouped[cat].sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    const group = el('div',{class:'group'});
    group.appendChild(el('div',{class:'group-head'},
      el('span',{class:'cat-swatch', style:`background:${catColor(cat)}`}),
      el('span',{class:'name'}, cat),
      el('span',{class:'n'}, `${items.filter(i=>i.completed).length}/${items.length}`)
    ));
    items.forEach(t=>group.appendChild(renderTask(t)));
    main.appendChild(group);
  });
  return main;
}

function formatTime12h(timeStr){
  if(!timeStr) return '';
  const [h,m] = timeStr.split(':').map(Number);
  const period = h>=12 ? 'PM' : 'AM';
  const h12 = h%12===0 ? 12 : h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}

function formatTimeRange(t){
  if(!t.time) return '';
  if(!t.endTime) return formatTime12h(t.time);
  const s = formatTime12h(t.time), e = formatTime12h(t.endTime);
  return (s.slice(-2) === e.slice(-2) ? s.slice(0,-3) : s) + '–' + e;
}

function renderTask(t){
  const isEvent = t.type==='event';
  const overdue = isOverdue(t);
  const justToggled = t.id === state.lastToggledId;
  const dateLabel = parseDate(t.dueDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}) + (isEvent && t.time ? ' · '+formatTimeRange(t) : '');
  const hasSubtasks = !isEvent && t.subtasks && t.subtasks.length>0;
  const subtaskDoneCount = hasSubtasks ? t.subtasks.filter(s=>s.completed).length : 0;
  const isExpanded = state.expandedSubtaskIds.includes(t.id);

  const marker = isEvent
    ? el('div',{class:'event-marker', title:'Event — not something to check off'}, '📌')
    : el('div',{class:'checkbox'+(t.completed?' checked':'')+(justToggled?' pop':''), onclick:()=>toggleTask(t.id)}, t.completed?'✓':'');

  const taskEl = el('div',{class:'task'+(overdue?' overdue':'')+(t.completed?' done':'')+(justToggled?' pop':'')+(t.priority?' priority':'')+(isEvent?' event-row':'')},
    marker,
    el('div',{class:'task-body'},
      el('div',{class:'title-row'},
        t.priority ? el('span',{class:'priority-star', title:'High priority'}, '★') : null,
        el('div',{class:'title'}, t.title)
      ),
      el('div',{class:'meta'},
        el('span',{class:'badge '+(isEvent?'event':(overdue?'overdue':'due'))}, (isEvent?'':(overdue?'Overdue · ':'Due '))+dateLabel),
        el('span',{class:'badge cat'}, t.category),
        (t.recurrence && t.recurrence!=='none') ? el('span',{class:'badge recur'}, '↻ '+RECUR_LABEL[t.recurrence]) : null,
        (t.remindTime && !t.completed) ? el('span',{class:'badge cat', title:'Reminder set'}, '🔔 '+formatTime12h(t.remindTime)) : null,
        hasSubtasks ? el('button',{class:'badge subtask-toggle', onclick:()=>toggleSubtaskExpanded(t.id)}, (isExpanded?'▾ ':'▸ ')+subtaskDoneCount+'/'+t.subtasks.length) : null
      ),
      t.notes ? el('div',{class:'notes'}, t.notes) : null,
      (hasSubtasks && isExpanded) ? el('div',{class:'subtask-list'},
        ...t.subtasks.map(s=> el('div',{class:'subtask-row'+(s.completed?' done':'')},
          el('span',{class:'subtask-checkbox'+(s.completed?' checked':''), onclick:()=>toggleSubtask(t.id, s.id)}, s.completed?'✓':''),
          el('span',{class:'subtask-title'}, s.title)

      ) : null
    ),
    el('div',{class:'task-actions'},
      el('button',{onclick:()=>{ duplicateTask(t.id); }, title:'Duplicate'}, '⧉'),
      el('button',{onclick:()=>{ state.editingTask=t; state.modalOpen=true; render(); }, title:'Edit'}, '✎'),
      el('button',{onclick:()=>{ if(confirm('Delete this task?')) deleteTask(t.id); }, title:'Delete'}, '✕')
    )
  );
  return taskEl;
}

// Self-contained date picker: a button showing the chosen date that opens a
// themed calendar dropdown. Built as a standalone factory (not routed through
// the app's global render()) so it behaves like the modal's other plain
// inputs — no risk of it being torn down and losing state mid-interaction.
function createDatePicker(initialDateStr){
  let selectedDate = initialDateStr;
  let pickerOffset = 0;
  const sel = parseDate(selectedDate);
  const now = new Date();
  pickerOffset = (sel.getFullYear()-now.getFullYear())*12 + (sel.getMonth()-now.getMonth());

  const displayBtn = el('button',{type:'button', class:'date-field-btn'},
    el('span',{}, niceDateLong(selectedDate)),
    el('span',{class:'date-field-icon'}, '📅')
  );
  const popover = el('div',{class:'date-popover hidden'});
  const wrapper = el('div',{class:'date-field-wrap'}, displayBtn, popover);

  function outsideClickHandler(e){ if(!wrapper.contains(e.target)){ closePopover(); } }
  function openPopover(){ renderPopover(); popover.classList.remove('hidden'); setTimeout(()=>document.addEventListener('click', outsideClickHandler), 0); }
  function closePopover(){ popover.classList.add('hidden'); document.removeEventListener('click', outsideClickHandler); }

  function renderPopover(){
    popover.innerHTML = '';
    const dates = calendarGridDates(pickerOffset);
    const monthName = monthDate(pickerOffset).toLocaleDateString('en-US',{month:'long', year:'numeric'});
    const currentMonthIdx = monthDate(pickerOffset).getMonth();

    popover.appendChild(el('div',{class:'date-popover-header'},
      el('button',{type:'button', onclick:(e)=>{ e.stopPropagation(); pickerOffset--; renderPopover(); }}, '‹'),
      el('div',{class:'date-popover-month'}, monthName),
      el('button',{type:'button', onclick:(e)=>{ e.stopPropagation(); pickerOffset++; renderPopover(); }}, '›')
    ));

    const grid = el('div',{class:'date-popover-grid'});
    ['M','T','W','T','F','S','S'].forEach(d=>grid.appendChild(el('div',{class:'date-popover-dow'}, d)));
    dates.forEach(d=>{
      const ds = fmt(d);
      const inMonth = d.getMonth()===currentMonthIdx;
      const isToday = ds===todayStr();
      const isSelected = ds===selectedDate;
      grid.appendChild(el('div',{
        class:'date-popover-cell'+(inMonth?'':' other-month')+(isToday?' today':'')+(isSelected?' selected':''),
        onclick:(e)=>{
          e.stopPropagation();
          selectedDate = ds;
          displayBtn.replaceChildren(el('span',{}, niceDateLong(selectedDate)), el('span',{class:'date-field-icon'}, '📅'));
          closePopover();
        }
      }, String(d.getDate())));
    });
    popover.appendChild(grid);

    popover.appendChild(el('button',{type:'button', class:'date-popover-today', onclick:(e)=>{
      e.stopPropagation();
      selectedDate = todayStr();
      pickerOffset = 0;
      displayBtn.replaceChildren(el('span',{}, niceDateLong(selectedDate)), el('span',{class:'date-field-icon'}, '📅'));
      closePopover();
    }}, 'Today'));
  }

  displayBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(popover.classList.contains('hidden')) openPopover(); else closePopover();
  });

  return { el: wrapper, getValue: ()=>selectedDate };
}

function createSubtaskEditor(initialSubtasks){
  let subtasks = (initialSubtasks || []).map(s=>({...s}));

  function renderList(){
    listEl.innerHTML = '';
    subtasks.forEach((s,idx)=>{
      listEl.appendChild(el('div',{class:'subtask-edit-row'},
        el('span',{class:'subtask-edit-title'}, s.title),
        el('button',{type:'button', onclick:()=>{ subtasks.splice(idx,1); renderList(); }}, '✕')
      ));
    });
  }
  renderList();

  function addSubtask(){
    const title = inputEl.value.trim();
    if(!title) return;
    subtasks.push({ id: genId(), title, completed:false });
    inputEl.value = '';
    renderList();
  }
  inputEl.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); addSubtask(); } });

  const wrap = el('div',{class:'subtask-editor'},
    listEl,
    el('div',{class:'subtask-add-row'}, inputEl, el('button',{type:'button', onclick: addSubtask}, '+'))
  );
  return { el: wrap, getValue: ()=> subtasks };
}

    el('div',{class:'field'}, el('label',{},'Category'), catSelect),
    el('div',{class:'field', style:'position:relative;'}, dateLabel, datePicker.el),
    completedPicker ? el('div',{class:'field', style:'position:relative;'}, el('label',{},'Completed on'), completedPicker.el) : null,
    timeFieldWrap,
    el('div',{class:'field'}, el('label',{},'Remind me at (optional)'), remindInput,
      el('div',{class:'settings-hint', style:'margin-top:5px;'}, 'Pops up with a sound on the due date while this tab is open.')),
    el('div',{class:'field'}, el('label',{},'Repeats'), recurSelect),
    el('div',{class:'field'}, el('label',{},'Notes'), notesInput),
    subtaskFieldWrap,
    el('div',{class:'modal-actions'},
      el('button',{onclick:()=>{ state.modalOpen=false; render(); }}, 'Cancel'),
      submitBtn
    )
  );
  return el('div',{class:'overlay', onclick:(e)=>{ if(e.target.classList.contains('overlay')){ state.modalOpen=false; render(); } }}, modal);
}

function bestCategoryStat(){
  const catStats = state.categories.map(cat=>{
    const tasks = state.tasks.filter(t=>t.category===cat && (t.completed || t.dueDate < todayStr()));
    const completed = tasks.filter(t=>t.completed).length;
    return { cat, total: tasks.length, rate: tasks.length ? Math.round(completed/tasks.length*100) : null };
  }).filter(c=>c.total>=1);
  if(!catStats.length) return null;
  return catStats.slice().sort((a,b)=>b.rate-a.rate)[0];
}

      el('div',{class:'badge-icon'}, a.unlocked ? a.icon : '🔒'),

function downloadAchievementCard(){
  const node = document.getElementById('share-card');
  if(!node || !window.html2canvas) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || THEMES.moonlit.exportBg;
  window.html2canvas(node, { backgroundColor: bg, scale:2 }).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'weekly-achievements.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(err=>{ console.error('Export failed', err); });
}

function renderPlotLogPanel(){
  const log = state.plot.log;
  const panel = el('div',{class:'plot-log-panel'});
  panel.appendChild(el('div',{class:'section-title'}, `✨ The Element of Surprise — ${log.length} moment${log.length===1?'':'s'} so far`));
  if(!log.length){
    panel.appendChild(el('div',{class:'empty'}, 'Nothing logged yet — tap the ✨ in the header whenever you want a little nudge.'));
    return panel;
  }
  const sorted = log.slice().sort((a,b)=> b.date.localeCompare(a.date));
  sorted.slice(0,10).forEach(entry=>{
    panel.appendChild(el('div',{class:'plot-log-entry'},
      el('span',{class:'plot-log-date'}, niceDate(entry.date)),
      el('span',{class:'plot-log-text'}, entry.text)
    ));
  });
  if(sorted.length>10){
    panel.appendChild(el('div',{class:'plot-log-more'}, `+ ${sorted.length-10} earlier`));
  }
  return panel;
}

/* ============================ UPDATE CHECK ============================ */
// Each upload changes the version stamp in <meta name="app-version">. The running page compares
// its own stamp with a fresh copy fetched from the server (bypassing the browser cache), so a
// stale copy can say so instead of silently staying old. Does nothing when opened as a local file.
const APP_VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || '';
async function checkForAppUpdate(){
  if(!APP_VERSION || location.protocol === 'file:' || state.updateAvailable) return;
  try{
    const url = location.href.split('#')[0].split('?')[0] + '?v=' + Date.now();
    const res = await fetch(url, { cache:'no-store' });
    if(!res.ok) return;
    const txt = await res.text();
    const m = txt.match(/<meta name="app-version" content="([^"]*)"/);
    if(m && m[1] && m[1] !== APP_VERSION){
      state.updateAvailable = true;
      const nn = txt.match(/<meta name="app-notes" content="([^"]*)"/);
      state.updateNotes = nn ? nn[1] : '';
      // Don't rebuild the page under an open form; the banner shows on the next normal render.
      if(!state.modalOpen && !state.settingsOpen && !state.editingAppName) render();
    }
  }catch(e){ /* offline or blocked: try again next time */ }
}
function renderUpdateBanner(){
  return el('div',{class:'banner'},
    el('div',{class:'msg'}, 'A newer version is ready' + (state.updateNotes ? ': ' + state.updateNotes : '.')),
    el('button',{class:'habit-accept-btn', onclick:()=>location.reload()}, 'Reload')
  );
}

/* ============================ INIT ============================ */
async function init(){
  document.getElementById('app').innerHTML = '<div class="fine" style="padding-top:60px;">Loading…</div>';
  await loadState();
  applyTheme(state.meta.theme);
  const fieldsFixed = migrateTaskFields();
  const migrated = migrateLegacyRecurring();
  const toppedUp = topUpAllSeries();
  if(fieldsFixed || migrated || toppedUp){ await saveTasks(); }
  if(migratePeriodData()){ await savePeriod(); }
  if(migratePeriodEnabledFlag()){ await savePeriod(); await saveMeta(); }
  checkDailyReminder();
  checkWrappedTrigger();
  render();
  checkPeriodNotice();
  setInterval(checkPeriodNotice, 15*60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkPeriodNotice(); });
  checkForAppUpdate();
  setInterval(checkForAppUpdate, 5*60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForAppUpdate(); });
  checkTaskReminders();
  setInterval(checkTaskReminders, 30000);
}
init();

})();
